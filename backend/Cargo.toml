[package]
name = "blocksmith"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization / Deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SHA256 hashing
sha2 = "0.10"

# Date & time
chrono = "0.4"

# Hex encoding
hex = "0.4"

